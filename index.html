<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Open Plnnr AI</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#080C14; color:#E8EBF1;
         font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif; text-align:center; padding:0 24px; }
  main { max-width:360px; }
  h1 { font-size:26px; line-height:32px; letter-spacing:-0.5px; margin:0 0 10px; }
  p { color:#9EA5B2; font-size:16px; line-height:23px; margin:0 0 28px; }
  a.btn { display:block; background:#8B3DFF; color:#FEFEFE; text-decoration:none; font-weight:600; font-size:17px; padding:16px 24px; border-radius:12px; }
  a.alt { display:inline-block; margin-top:18px; color:#B188FF; font-size:15px; text-decoration:none; }
</style>
</head>
<body>
<main>
  <h1>Opening Plnnr AI&hellip;</h1>
  <p>If nothing happens, tap the button.</p>
  <a class="btn" id="open" href="plnnr://today">Open Plnnr AI</a>
  <a class="alt" href="https://apps.apple.com/us/app/plnnr-plan-your-day-faster/id6740782723">Don't have the app? Get it on the App Store</a>
</main>
<script>
  // Only the app's own screens: this page never sends anyone anywhere else.
  var ROUTES = { addtask: 'addtask', planmyday: 'planmyday', tomorrow: 'planmyday?day=tomorrow', today: 'today', todo: 'todo', aitalk: 'aitalk' };
  var to = new URLSearchParams(location.search).get('to');
  var url = 'plnnr://' + (ROUTES[to] || 'today');
  document.getElementById('open').href = url;
  location.href = url;
</script>
</body>
</html>
